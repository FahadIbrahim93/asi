---
name: ci

# Benchmarks never execute in CI. The runtime lane collects only tests selected
# by `not slow`, balances their files by collected-node count, and caps xdist at
# two workers so JAX compilation remains inside hosted-runner memory limits.
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: >-
    ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SHARD_COUNT: "8"
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package-check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' uv twine

      - name: Check the committed lockfile
        run: uv lock --check

      - name: Prime the offline distribution build cache
        run: |
          uv build \
            --no-build-logs \
            --no-create-gitignore \
            --out-dir "$RUNNER_TEMP/package-preflight" \
            .

      - name: Validate distribution metadata
        run: python -m twine check "$RUNNER_TEMP"/package-preflight/*

      - name: Exercise the wheel and sdist contract
        run: |
          python -m pytest \
            tests/test_historical_forager_cli_package.py \
            -k test_wheel_and_sdist_ship_historical_code_and_entrypoint \
            -q -o addopts=""

  exact-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the robot compatibility floor
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())
          excluded = {"jax", "jaxlib", "numpy"}
          retained = []
          seen = set()
          for requirement in project["project"]["dependencies"]:
              match = re.match(r"[A-Za-z0-9_.-]+", requirement)
              if match is None:
                  raise SystemExit(f"unparseable requirement: {requirement}")
              name = match.group(0).lower().replace("_", "-")
              if name in excluded:
                  seen.add(name)
              else:
                  retained.append(requirement)
          if seen != excluded:
              missing = excluded - seen
              raise SystemExit(f"missing compatibility requirements: {missing}")
          destination = (
              Path(os.environ["RUNNER_TEMP"]) / "floor-requirements.txt"
          )
          destination.write_text("\n".join(retained) + "\n", encoding="utf-8")
          PY
          python -m venv "$RUNNER_TEMP/exact-floor"
          floor_python="$RUNNER_TEMP/exact-floor/bin/python"
          "$floor_python" -m pip install --upgrade pip
          "$floor_python" -m pip install \
            --requirement "$RUNNER_TEMP/floor-requirements.txt" \
            'jax==0.7.1' \
            'jaxlib==0.7.1' \
            'numpy==1.26.0' \
            'pytest>=8.0'
          "$floor_python" -m pip check

      - name: Eager-import the root and robot surfaces
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          "$RUNNER_TEMP/exact-floor/bin/python" - <<'PY'
          import importlib

          import jax
          import jaxlib
          import numpy

          import alberta_framework

          robot_modules = (
              "alberta_framework.core.actor_critic",
              "alberta_framework.core.continual_backprop",
              "alberta_framework.core.initializers",
              "alberta_framework.core.normalizers",
              "alberta_framework.core.optimizers",
              "alberta_framework.core.sarsa",
          )
          for module_name in robot_modules:
              module = importlib.import_module(module_name)
              assert module.__name__ == module_name

          root_symbols = (
              "ActorCriticAgent",
              "ContinualBackpropConfig",
              "IDBD",
              "Normalizer",
              "SARSAAgent",
              "sparse_init",
          )
          for symbol in root_symbols:
              assert getattr(alberta_framework, symbol) is not None

          assert jax.__version__ == "0.7.1"
          assert jaxlib.__version__ == "0.7.1"
          assert numpy.__version__ == "1.26.0"
          PY

      - name: Exercise exact-floor runtime behavior
        run: |
          initializer_node="tests/test_initializers.py::"
          initializer_node+="TestSparseInit::test_correct_output_shape"
          optimizer_node="tests/test_optimizer_registry.py::"
          optimizer_node+="test_round_trip_with_default_args[IDBD]"
          sarsa_node="tests/test_sarsa.py::"
          sarsa_node+="TestSARSAConfigSerialization::test_agent_config_roundtrip"
          actor_node="tests/test_actor_critic.py::"
          actor_node+="test_actor_critic_update_is_jittable"
          "$RUNNER_TEMP/exact-floor/bin/python" -m pytest \
            "$initializer_node" \
            "$optimizer_node" \
            "$sarsa_node" \
            "$actor_node" \
            -q -o addopts=""

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

  test-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install collection dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -e '.[dev,gymnasium,forager]' \
            pytest-xdist

      - name: Collect selected non-slow tests
        run: |
          python -m pytest tests \
            --collect-only \
            -q \
            --disable-warnings \
            -m "not slow" \
            -o addopts="" \
            > "$RUNNER_TEMP/non-slow-nodeids.txt"

      - name: Build balanced nonempty shard matrix
        id: plan
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          nodeids = Path(
              os.environ["RUNNER_TEMP"], "non-slow-nodeids.txt"
          ).read_text(encoding="utf-8").splitlines()
          counts = Counter(
              line.split("::", 1)[0]
              for raw in nodeids
              if (line := raw.strip()).startswith("tests/") and "::" in line
          )
          if not counts:
              raise SystemExit("pytest selected no non-slow test nodes")

          limit = int(os.environ["SHARD_COUNT"])
          shard_count = min(limit, len(counts))
          buckets = [[] for _ in range(shard_count)]
          totals = [0 for _ in range(shard_count)]
          ordered = sorted(counts.items(), key=lambda item: (-item[1], item[0]))
          for path, count in ordered:
              index = min(
                  range(shard_count),
                  key=lambda candidate: (totals[candidate], candidate),
              )
              buckets[index].append(path)
              totals[index] += count

          include = []
          for version in ("3.12", "3.13"):
              for index, files in enumerate(buckets):
                  if not files:
                      continue
                  include.append(
                      {
                          "python": version,
                          "shard": index + 1,
                          "files_json": json.dumps(sorted(files)),
                          "node_count": totals[index],
                      }
                  )
          matrix = json.dumps({"include": include}, separators=(",", ":"))
          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"matrix={matrix}\n")
          with open(
              os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8"
          ) as summary:
              summary.write(
                  f"Selected {sum(counts.values())} non-slow nodes in "
                  f"{len(counts)} files across {shard_count} shards.\n"
              )
          PY

  test:
    name: >-
      runtime py${{ matrix.python }} shard ${{ matrix.shard }}
    needs: test-plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runtime-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -e '.[dev,gymnasium,forager]' \
            pytest-xdist

      - name: Run selected non-slow tests
        env:
          JUNIT_PATH: >-
            ${{ runner.temp }}/junit-py${{ matrix.python
            }}-shard-${{ matrix.shard }}.xml
          TEST_FILES_JSON: ${{ matrix.files_json }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          files = json.loads(os.environ["TEST_FILES_JSON"])
          if not files:
              raise SystemExit("the test plan emitted an empty shard")
          for value in files:
              path = Path(value)
              if path.parts[0] != "tests" or not path.is_file():
                  raise SystemExit(f"invalid selected test file: {value}")

          command = [
              sys.executable,
              "-m",
              "pytest",
              *files,
              "-q",
              "-rs",
              "-o",
              "addopts=",
              "-m",
              "not slow",
              "-n",
              "2",
              "--dist",
              "loadfile",
              "--durations=25",
              "--durations-min=1.0",
              f"--junitxml={os.environ['JUNIT_PATH']}",
          ]
          print(
              f"running {len(files)} files; planned selected nodes: "
              "${{ matrix.node_count }}",
              flush=True,
          )
          raise SystemExit(subprocess.run(command, check=False).returncode)
          PY

      - name: Upload runtime timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            junit-runtime-py${{ matrix.python }}-shard-${{ matrix.shard }}
          path: >-
            ${{ runner.temp }}/junit-py${{ matrix.python
            }}-shard-${{ matrix.shard }}.xml
          if-no-files-found: warn
          retention-days: 14
