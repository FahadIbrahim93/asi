name: ci

# JAX compilation makes the suite memory-intensive on hosted runners. Test
# files are sharded and each job is capped at two xdist workers to keep memory
# use bounded.
#
#   lint — ruff + mypy on both supported interpreters.
#   test — the complete non-slow suite on Python 3.12 for pull requests and
#          both supported interpreters on main/manual runs.
#
# Benchmarks never run in CI. They are executed through their CLIs on hardware
# that can afford them; see outputs/ipmnist_screening/RUNBOOK.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SHARD_COUNT: "8"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (editable, with dev extras)
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]'

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.12", "3.13"]') }}
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (editable, with test extras)
        run: |
          python -m pip install -U pip
          pip install -e '.[dev,gymnasium,forager]' pytest-xdist

      - name: Test shard ${{ matrix.shard }} of ${{ env.SHARD_COUNT }}
        run: |
          set -euo pipefail
          mapfile -t files < <(
            find tests -name 'test_*.py' | sort |
              awk -v n="$SHARD_COUNT" -v s="${{ matrix.shard }}" 'NR % n == s % n'
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::shard ${{ matrix.shard }} selected no test files"
            exit 1
          fi
          echo "shard ${{ matrix.shard }}: ${#files[@]} files"
          python -m pytest "${files[@]}" -q -rs \
            -m "not slow" -n 2 --dist loadfile --durations=10
